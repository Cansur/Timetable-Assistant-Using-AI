        <!-- Main Content -->
        <div id="layoutSidenav_content">
            <main>

                <!-- Header -->
                <div class="border-bottom d-flex justify-content-between p-3">
                    <div class="px-4 fw-semibold">My schedule</div>
                    <div class="px-4 fw-semibold">...</div>
                </div>

                <!-- Schedule -->
                <div class="card mb-4 mx-4 my-5">
                    <div class="card-header">
                        <i class="fas fa-table me-1"></i>
                        TimeTable
                    </div>
                    <div class="card-body ">
                        <table class="table table-bordered table-striped text-center">
                            <thead class="table-dark">
                                <tr>
                                    <th style="width: 80px;"></th>
                                    <th>월</th>
                                    <th>화</th>
                                    <th>수</th>
                                    <th>목</th>
                                    <th>금</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- 1교시 ~ 15교시 -->
                                <script>
                                    for (let i = 1; i <= 15; i++) {
                                        document.write(`<tr style="height: 60px;">
                                                <td style="width: 80px; white-space: nowrap;">${i}교시</td>
                                                <td></td>
                                                <td></td>
                                                <td></td>
                                                <td></td>
                                                <td></td>
                                            </tr>`);
                                    }
                                </script>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 검색 버튼 -->
                <button id="searchButton" class="position-fixed start-50 btn btn-danger" style="bottom: 30px;">수업
                    목록에서
                    검색</button>

                <!-- 검색 창 (기본적으로 숨김) -->
                <div id="searchContainer" class="search-container">

                    <!-- 검색 창 헤더 부분 -->
                    <div class="search-header">
                        <div class="d-flex">
                            <div class="mx-2 badge rounded-pill text-bg-secondary d-flex align-items-center px-3"
                                style="height: 28px;">전공/영역: 전체</div>
                            <div type="button"
                                class="mx-2 badge rounded-pill text-bg-secondary d-flex align-items-center px-3"
                                style="height: 28px;">검색어: 없음</div>
                            <div class="mx-2 badge rounded-pill text-bg-secondary d-flex align-items-center px-3"
                                style="height: 28px;">정렬: 기본</div>
                            <div class="mx-2 badge rounded-pill text-bg-secondary d-flex align-items-center px-3"
                                style="height: 28px;">시간: 전체</div>
                            <div class="mx-2 badge rounded-pill text-bg-secondary d-flex align-items-center px-3"
                                style="height: 28px;">구분: 전체</div>
                            <div class="mx-2 badge rounded-pill text-bg-secondary d-flex align-items-center px-3"
                                style="height: 28px;">학점: 전체</div>
                        </div>
                        <!-- <input type="text" id="searchInput" class="form-control" placeholder="수업명을 입력하세요..." /> -->
                        <button id="closeButton" class="btn btn-danger">닫기</button>
                    </div>

                    <!-- 검색 결과 테이블 -->
                    <table class="search-table">
                        <thead>
                            <tr>
                                <th>교과번호-분반</th>
                                <th>교과목명</th>
                                <th>학점</th>
                                <th>이수구분</th>
                                <th>담당교수</th>
                                <th>수업시간</th>
                                <th>강의실</th>
                                <!-- <th>강의평</th> -->
                                <th>담은 인원</th>
                                <th>비고</th>
                            </tr>
                        </thead>
                        <tbody id="searchResults">
                            <!-- 검색 결과가 여기에 추가됨 -->
                        </tbody>
                    </table>
                </div>


            </main>
