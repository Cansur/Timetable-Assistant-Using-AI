<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="트랙 추천" />
    <meta name="author" content="GPT" />
    <title>Helper - 트랙 추천</title>
    <link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css" rel="stylesheet" />
    <link href="/static/css/styles.css" rel="stylesheet" />
    <link href="/static/css/myStyles.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>

<body class="bg-gray-100">
    <!-- 네비게이션 바 -->
    <nav class="bg-indigo-500 p-4 shadow text-white">
        <div class="container mx-auto flex justify-between">
            <div class="text-lg font-semibold">Helper</div>
            <div class="space-x-4">
                <a href="/" class="hover:underline">내 시간표</a>
                <a href="#" class="hover:underline">시간표 짜기</a>
                <a href="/chat" class="hover:underline">학점 계산기</a>
                <a href="/statistics" class="hover:underline">전체 아기테쳐</a>
                <a href="#" class="hover:underline">도움말</a>
            </div>
        </div>
    </nav>

    <!-- 본문 콘텐츠 -->
    <main class="container mx-auto mt-10">
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-2xl font-bold mb-6">트랙 추천</h2>

            <!-- 선택 폼 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div>
                    <label for="track" class="block mb-1 font-medium text-gray-700">전공 선택</label>
                    <select id="track" class="w-full border border-gray-300 rounded px-3 py-2">
                        <option value="빅데이터">빅데이터</option>
                        <option value="콘텐츠IT">콘텐츠IT</option>
                        <option value="스마트IoT">스마트IoT</option>
                    </select>
                </div>
                <div>
                    <label for="grade" class="block mb-1 font-medium text-gray-700">학년 선택</label>
                    <select id="grade" class="w-full border border-gray-300 rounded px-3 py-2">
                        <option value="1학년">1학년</option>
                        <option value="2학년">2학년</option>
                        <option value="3학년">3학년</option>
                        <option value="4학년">4학년</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button onclick="fetchRecommendation()" class="w-full bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 transition">
                        추천 받기
                    </button>
                </div>
            </div>

            <!-- 결과 영역 -->
            <div id="result" style="display: none;">
                <h3 class="text-lg font-semibold mb-2">추천 과목</h3>
                <ul id="subject-list" class="list-disc list-inside text-gray-800"></ul>
            </div>
        </div>
    </main>

    <script>
        async function fetchRecommendation() {
            const track = document.getElementById('track').value;
            const grade = document.getElementById('grade').value;

            const response = await fetch('/api/track-recommend', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ track, grade })
            });

            const data = await response.json();
            const list = document.getElementById('subject-list');
            const resultBox = document.getElementById('result');

            list.innerHTML = '';
            if (data.subjects) {
                data.subjects.forEach(subject => {
                    const li = document.createElement('li');
                    li.textContent = subject;
                    list.appendChild(li);
                });
                resultBox.style.display = 'block';
            } else {
                list.innerHTML = '<li>추천 과목이 없습니다.</li>';
            }
        }
    </script>
</body>
</html>
