<!-- templates/track_recommend.html -->
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="트랙 추천" />
    <meta name="author" content="GPT" />
    <title>Helper - 트랙 추천</title>
    <link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css" rel="stylesheet" />
    <link href="/static/css/mainIndex.css" rel="stylesheet" />
</head>

<body>
    <!-- ✅ 네비게이션 바 통일 -->
    <header>
        <nav>
            <ul class="nav-list">
                <div class="nav-logo">Helper</div>
                <li><a href="/">내 시간표</a></li>
                <li class="dropdown">
                    <a href="#">시간표 짜기 ▾</a>
                    <ul class="dropdown-content">
                        <li><a href="/chat">AI 추천</a></li>
                        <li><a href="/compare">비교하기</a></li>
                    </ul>
                </li>
                <li><a href="/track_recommend">트랙 추천</a></li>
                <li><a href="/statistics">통계</a></li>
            </ul>
        </nav>
    </header>

    <!-- ✅ 트랙 추천 내용 영역 -->
    <main class="content">
        <h2 class="section-title">트랙 추천</h2>
        <form action="/track_recommend" method="post" class="form-box">
            <label for="grade">학년 선택</label>
            <select name="grade" id="grade">
                <option value="1">1학년</option>
                <option value="2">2학년</option>
                <option value="3">3학년</option>
            </select>

            <label for="major">전공 선택</label>
            <select name="major" id="major">
                <option value="빅데이터">빅데이터</option>
                <option value="콘텐츠IT">콘텐츠IT</option>
                <option value="스마트IoT">스마트IoT</option>
            </select>


            <button type="submit" class="btn-submit">추천 받기</button>
        </form>

        {% if recommendations %}
        <div class="recommend-box">
            <h3>추천 과목</h3>
            <ul>
                {% for subject in recommendations %}
                <li>{{ subject }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}
    </main>
</body>

</html>
