<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Helper</title>
    <!-- Bootstrap CSS -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" /> -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css" rel="stylesheet" /> -->
    <link href="static/css/mainIndex.css" rel="stylesheet" />
    <link href="static/css/chatLayout.css" rel="stylesheet" />
    <!-- <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" /> -->
</head>

<body style="background-color: #f4f4fc;">

    <!-- ✅ 수정된 네비게이션 -->
    <header>
        <nav>
            <ul class="nav-list">
                <li><a href="/">내 시간표</a></li>
                <li class="dropdown">
                    <a href="#">시간표 짜기 ▾</a>
                    <ul class="dropdown-content">
                        <li><a href="/chat">AI와 짜기</a></li>
                        <li><a href="/">직접 짜기</a></li>
                        <li><a href="/statistics">분석 하기</a></li>
                        <li><a href="/compare">시간표 비교 하기</a></li>
                    </ul>
                </li>
                <li><a href="#">학점 계산기</a></li>
                <li><a href="#">전체 아키텍처</a></li>
                <li><a href="https://github.com/Cansur/Timetable-Assistant-Using-AI">도움말</a></li>
            </ul>
        </nav>
    </header>

    <main class="chat-page">
        <div class="chat-container">
            <div class="chat-box">
                <div class="chat-header">AI와의 대화</div>
                <div id="chatDisplay" class="chat-display">
                    <!-- 메시지 출력 -->
                </div>
            </div>
        </div>

        <!-- ✅ 고정 입력창 -->
        <div class="chat-input-fixed">
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="메시지 입력..." />
                <button id="sendMessage" class="btn-rounded">
                    <i class="fas fa-arrow-up"></i> 전송
                </button>
            </div>
        </div>

        <!-- 시간표 모달 (Bootstrap 제거 버전) -->
        <div id="lectureModal" class="custom-modal hidden fade-in">
            <div class="custom-modal-overlay"></div>
            <div class="custom-modal-box">
                <div class="custom-modal-content">
                    <h6 class="modal-title">-시간표 미리보기-</h6>
                    <div class="table-wrapper">
                        <table class="table-bordered mini-table" id="timetable">
                            <thead>
                                <tr>
                                    <th>교시</th>
                                    <th>월</th>
                                    <th>화</th>
                                    <th>수</th>
                                    <th>목</th>
                                    <th>금</th>
                                </tr>
                            </thead>
                            <tbody id="timetable-body"></tbody>
                        </table>
                    </div>
                    <p class="modal-desc">이 시간표와 연동하시겠습니까?</p>
                    <div class="modal-btn-group">
                        <button id="confirmYes" class="btn-primary">예</button>
                        <button id="confirmNo" class="btn-secondary">아니오</button>
                    </div>
                </div>
            </div>
        </div>





    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script type="module" src="static/js/chat.js"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script> -->
</body>

</html>
