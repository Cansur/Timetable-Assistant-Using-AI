        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-6 py-8 bg-gray-800 min-h-screen flex flex-col relative">
                    <h1 class="text-2xl font-semibold text-white mb-6" style="font-family: 'Inter', sans-serif;">Helper
                        AI</h1>
                    <div
                        class="bg-gray-700 bg-opacity-80 rounded-2xl shadow-2xl border border-gray-600 overflow-hidden flex-1 mb-20 relative">
                        <div class="p-4 border-b border-gray-600">
                            <span class="text-sm text-gray-300" style="font-family: 'Inter', sans-serif;">AI와의 대화</span>
                        </div>
                        <div class="p-6 max-h-[calc(100vh-250px)] overflow-y-auto flex flex-col space-y-4"
                            id="chatDisplay">
                            <!-- Chat messages will be dynamically added here -->
                        </div>
                        <button id="scrollToBottom"
                            class="hidden absolute bottom-6 right-6 bg-blue-400 text-white p-3 rounded-full hover:bg-blue-500 transition-all shadow-md z-20"
                            title="아래로 스크롤">
                            <i class="fas fa-arrow-down"></i>
                        </button>
                    </div>
                    <div
                        class="fixed bottom-0 left-0 right-0 p-4 bg-gray-700 bg-opacity-80 border-t border-gray-600 z-10">
                        <div class="container-fluid px-6" style="padding-left: calc(250px + 1.5rem);">
                            <div class="flex items-center space-x-3">
                                <input type="text"
                                    class="flex-1 p-3 rounded-xl bg-gray-600 text-white border border-gray-500 focus:outline-none focus:border-blue-400 transition-all placeholder-gray-400 text-sm"
                                    id="chatInput" placeholder="메시지 입력..." aria-label="Chat input"
                                    style="font-family: 'Inter', sans-serif;" />
                                <button
                                    class="bg-blue-400 text-white p-3 rounded-xl hover:bg-blue-500 transition-all flex items-center text-sm"
                                    id="sendMessage" style="font-family: 'Inter', sans-serif;">
                                    <i class="fas fa-arrow-up mr-2"></i> 전송
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <!-- 시간표 모달 -->
        <div id="lectureModal" class="modal fade" tabindex="-1">
            <div class="modal-dialog modal-sm modal-dialog-centered">
                <div class="modal-content bg-body-tertiary border border-secondary-subtle shadow-sm">
                    <div class="modal-body p-3">
                        <h6 class="text-center text-secondary-emphasis mb-3">시간표 미리보기</h6>
                        <div class="table-responsive">
                            <table class="table table-bordered text-center align-middle table-sm mb-3" id="timetable"
                                style="font-size: 0.7rem;">
                                <thead class="table-light">
                                    <tr>
                                        <th style="width: 50px;">교시</th>
                                        <th style="width: 40px;">월</th>
                                        <th style="width: 40px;">화</th>
                                        <th style="width: 40px;">수</th>
                                        <th style="width: 40px;">목</th>
                                        <th style="width: 40px;">금</th>
                                    </tr>
                                </thead>
                                <tbody id="timetable-body" class="table-group-divider"></tbody>
                            </table>
                        </div>

                        <p class="text-secondary-emphasis small mb-2">이 시간표를 저장하시겠습니까?</p>

                        <div class="d-flex justify-content-end gap-2">
                            <button type="button" class="btn btn-outline-primary btn-sm">예</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm"
                                data-bs-dismiss="modal">아니오</button>ㅑ
                        </div>
                    </div>
