<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Helper</title>
    <link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css" rel="stylesheet" />
    <link href="static/css/mainIndex.css" rel="stylesheet" />
    <!-- <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script> -->
</head>

<body>

    <!-- 네비게이션 -->
    <header>
        <nav>
            <ul class="nav-list">
                <li class="dropdown">
                    <a href="#">시간표 짜기 ▾</a>
                    <ul class="dropdown-content">
                        <li><a href="#">AI와 짜기</a></li>
                        <li><a href="#">직접 짜기</a></li>
                    </ul>
                </li>
                <li><a href="#">학점 계산기</a></li>
                <li><a href="#">전체 아키텍처</a></li>
                <li><a href="#">도움말</a></li>
            </ul>
        </nav>
    </header>

    <!-- 메인 -->
    <main class="main-centered">
        <button id="addCourseBtn" class="btn-primary">+ 수업 넣기</button>

        <div id="schedule" class="timetable-card">
            <div class="timetable-header">
                <span>📅 시간표</span>
            </div>
            <div id="wrapper" class="online-list-wrapper"></div>
            <div class="timetable-body">
                <table id="timeTable" class="timetable-table">
                    <thead>
                        <tr>
                            <th></th>
                            <th>월</th>
                            <th>화</th>
                            <th>수</th>
                            <th>목</th>
                            <th>금</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- JS가 15행 x 6열 자동 생성 -->
                    </tbody>
                </table>

            </div>
        </div>

    </main>

    <!-- 검색 모달 -->
    <div id="searchContainer" class="modal">
        <div class="modal-content">

            <div class="modal-header">
                <span>🔍 수업 검색</span>
                <button id="closeButton" class="close-btn" title="닫기">✕</button>
            </div>

            <div class="modal-body">

                <div class="filter-bar">
                    <button class="filter-btn" data-filter="major">전공/영역: 없음</button>
                    <button class="filter-btn" data-filter="search">검색어: 없음</button>
                    <button class="filter-btn" data-filter="sort">정렬: 기본</button>
                    <button class="filter-btn" data-filter="time">시간: 전체</button>
                    <button class="filter-btn" data-filter="type">구분: 전체</button>
                    <button class="filter-btn" data-filter="credit">학점: 전체</button>
                </div>

                <!-- <div class="search-options">
                    <input id="searchInput" placeholder="과목명 또는 교수명 입력" />
                    <div class="radio-group">
                        <label><input type="radio" name="mode" id="radioName" checked /> 과목명</label>
                        <label><input type="radio" name="mode" id="radioProf" /> 교수명</label>
                    </div>
                </div> -->

                <div class="search-tags">
                    <span>검색어: <span id="selectedSearchName">없음</span></span>
                    <span>분류: <span id="selectedSearchField">없음</span></span>
                </div>

                <div class="result-wrapper">
                    <table class="table-result">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>교과목명</th>
                                <th>학점</th>
                                <th>이수구분</th>
                                <th>담당교수</th>
                                <th>수업시간</th>
                                <th>강의실</th>
                                <th>담은 인원</th>
                                <th>비고</th>
                            </tr>
                        </thead>
                        <tbody id="searchResults"></tbody>
                    </table>
                </div>

            </div>


        </div>
    </div>

    <!-- ✅ 검색어 입력 모달 -->
    <div id="searchKeywordModal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <span>🔍 검색어 입력</span>
                <button class="close-btn"
                    onclick="document.getElementById('searchKeywordModal').style.display='none'">✕</button>
            </div>
            <div class="modal-body">
                <input type="text" id="searchKeywordInput" placeholder="과목명 또는 교수명을 입력하세요" />
                <div class="radio-group mt-2">
                    <label><input type="radio" name="mode" id="radioName" checked /> 과목명</label>
                    <label><input type="radio" name="mode" id="radioProf" /> 교수명</label>
                </div>
                <button class="btn-primary mt-3" onclick="applySearchKeyword()">적용</button>
            </div>
        </div>
    </div>


    <!-- ✅ 전공/영역 선택 모달 -->
    <div id="searchCategoryModal" class="modal" style="display:none">
        <div class="modal-content">
            <div class="modal-header">
                <span>🎓 전공/영역 선택</span>
                <button class="close-btn" onclick="closeModal('searchCategoryModal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="field-row" onclick="applyCategory('없음')">없음</div>
                <div class="field-row" onclick="applyCategory('전공')">전공</div>
                <div class="field-row" onclick="applyCategory('일반교양')">일반교양</div>
                <div class="field-row" onclick="applyCategory('한림소양')">한림소양</div>
            </div>
        </div>
    </div>

    <!-- 오버레이 -->
    <div id="overlay" class="overlay"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script type="module" src="static/js/mainIndex.js"></script>
</body>

</html>
