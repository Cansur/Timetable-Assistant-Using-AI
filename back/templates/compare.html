<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>시간표 비교</title>
  <!-- 공통 스타일 복원 -->
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="stylesheet" href="/static/css/mainIndex.css">
  <link rel="stylesheet" href="/static/css/compare.css">
</head>

<body>
  <!-- 상단 네비게이션 복원 -->
  <header>
    <nav>
      <ul class="nav-list">
        <div class="nav-logo">Helper</div>
        <li><a href="/">내 시간표</a></li>
        <li class="dropdown">
          <a href="#">시간표 짜기 ▾</a>
          <ul class="dropdown-content">
            <li><a href="/chat">AI와 짜기</a></li>
            <li><a href="/">직접 짜기</a></li>
            <li><a href="/statistics">분석 하기</a></li>
            <li><a href="/compare">시간표 비교 하기</a></li>
          </ul>
        </li>
        <li><a href="#">학점 계산기</a></li>
        <li><a href="#">전체 아키텍처</a></li>
        <li><a href="https://github.com/Cansur/Timetable-Assistant-Using-AI">도움말</a></li>
      </ul>
    </nav>
  </header>

  <main class="main-centered">
    <!-- 시간표 카드 1 -->
    <div class="timetable-card">
      <div class="timetable-header">
        📅 시간표 1
        <button id="addCourseBtn1" class="btn-primary">+ 수업 넣기</button>
      </div>
      <table id="table1" class="timetable-table">
        <thead>
          <tr>
            <th></th>
            <th>월</th>
            <th>화</th>
            <th>수</th>
            <th>목</th>
            <th>금</th>
          </tr>
        </thead>
        <tbody>
          <!-- 1~11교시 구성 -->
          {% for i in range(1, 12) %}
          <tr>
            <td>{{ i }}교시</td>
            <td></td><td></td><td></td><td></td><td></td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>

    <!-- 시간표 카드 2 -->
    <div class="timetable-card">
      <div class="timetable-header">
        📅 시간표 2
        <button id="addCourseBtn2" class="btn-primary">+ 수업 넣기</button>
      </div>
      <table id="table2" class="timetable-table">
        <thead>
          <tr>
            <th></th>
            <th>월</th>
            <th>화</th>
            <th>수</th>
            <th>목</th>
            <th>금</th>
          </tr>
        </thead>
        <tbody>
          {% for i in range(1, 12) %}
          <tr>
            <td>{{ i }}교시</td>
            <td></td><td></td><td></td><td></td><td></td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>

    <!-- 오버레이 및 모달 -->
    <div id="overlay" class="overlay" style="display: none;"></div>
    <div id="searchContainer" class="modal-container" style="display: none;">
      <div class="modal-header">
        <span>🔍 수업 검색</span>
        <button id="closeButton" class="modal-close">X</button>
      </div>
      <div class="modal-body">
        <table class="course-table">
          <thead>
            <tr><th>과목명</th><th>학점</th><th>교수</th><th>시간</th></tr>
          </thead>
          <tbody id="courseTableBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module" src="/static/js/compare.js"></script>
</body>

</html>
