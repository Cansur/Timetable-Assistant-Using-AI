<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Helper - Statistics</title>

    <!-- 외부 CSS와 Chart.js -->
    <link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css" rel="stylesheet" />
    <link href="/static/css/mainIndex.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <!-- ✅ 상단 네비게이션 바 -->
    <header>
        <nav>
            <ul class="nav-list">
                <div class="nav-logo">Helper</div>
                <li><a href="/">내 시간표</a></li>
                <li class="dropdown">
                    <a href="#">시간표 짜기 ▾</a>
                    <ul class="dropdown-content">
                        <li><a href="/compare">시간표 비교</a></li>
                        <li><a href="/track">트랙 추천</a></li>
                    </ul>
                </li>
                <li><a href="/gpa">학점 계산기</a></li>
                <li><a href="/all">전체 아키텍처</a></li>
                <li><a href="/chat">도움말</a></li>
            </ul>
        </nav>
    </header>

    <!-- ✅ 본문 콘텐츠 -->
    <main style="margin-top: 80px; padding: 2rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
        <h2 style="font-size: 1.5rem;">📊 Statistics</h2>
        <p>Your study insights and patterns.</p>

        <p><strong>총 공부 시간:</strong> 3 시간</p>
        <p><strong>등록된 과목 수:</strong> 1 과목</p>
        <p><strong>가장 많이 공부한 과목:</strong> 영상문학</p>
    </div>

    <!-- ✅ 차트 중앙 정렬 -->
    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 2rem;">
        <div style="width: 300px; height: 300px;">
            <canvas id="subjectChart" style="width: 100%; height: 100%;"></canvas>
        </div>
        <div style="width: 300px; height: 300px;">
            <canvas id="weekdayChart" style="width: 100%; height: 100%;"></canvas>
        </div>
    </div>
</main>

    <!-- ✅ Chart.js 스크립트 -->
    <script>
        const subjectCtx = document.getElementById('subjectChart').getContext('2d');
        new Chart(subjectCtx, {
            type: 'pie',
            data: {
                labels: ['영상문학'],
                datasets: [{
                    data: [100],
                    backgroundColor: ['#ff6384']
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false
            }
        });

        const weekdayCtx = document.getElementById('weekdayChart').getContext('2d');
        new Chart(weekdayCtx, {
            type: 'doughnut',
            data: {
                labels: ['월', '수', '금'],
                datasets: [{
                    data: [33, 34, 33],
                    backgroundColor: ['#ff6384', '#ff9f40', '#4bc0c0']
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false
            }
        });
    </script>

</body>

</html>
