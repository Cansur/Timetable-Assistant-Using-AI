<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <title>시간표 추천 챗봇</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .chat-box {
      border: 1px solid #ccc;
      padding: 10px;
      height: 300px;
      overflow-y: auto;
      margin-bottom: 10px;
    }

    .user {
      font-weight: bold;
      color: blue;
    }

    .bot {
      font-weight: bold;
      color: green;
    }

    .error {
      font-weight: bold;
      color: red;
    }

    pre {
      background: #f4f4f4;
      padding: 10px;
      overflow-x: auto;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <h1>🗓️ 시간표 추천 챗봇</h1>

  <div class="chat-box" id="chatBox"></div>

  <form id="chatForm">
    <input type="text" id="userInput" placeholder="조건을 입력하세요 (예: 월수 오전 교양)" style="width: 70%; padding: 10px;" />
    <button type="submit" style="padding: 10px 20px;">보내기</button>
  </form>

  <script>
    const chatBox = document.getElementById("chatBox");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("userInput");

    const feedbackLog = []; // 현재는 빈 배열. 나중에 좋아요/싫어요 기록 연동 가능

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const userText = input.value.trim();
      if (!userText) return;

      chatBox.innerHTML += `<div><span class="user">🙋 너:</span> ${userText}</div>`;

      try {
        const res = await fetch("/api/recommend", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ input: userText, feedbackLog })
        });

        const data = await res.json();
        if (res.ok) {
          chatBox.innerHTML += `<div><span class="bot">🤖 GPT:</span><pre>${data.reply}</pre></div>`;
        } else {
          chatBox.innerHTML += `<div><span class="error">⚠️ 오류:</span> ${data.error || '알 수 없는 오류'}</div>`;
        }
      } catch (error) {
        chatBox.innerHTML += `<div><span class="error">⚠️ 오류:</span> 네트워크 오류: ${error.message}</div>`;
      }

      chatBox.scrollTop = chatBox.scrollHeight;
      input.value = "";
    });
  </script>
</body>

</html>
